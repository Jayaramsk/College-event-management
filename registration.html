<!DOCTYPE html>
<html>
<head>
    <title>Registration - Campus Events</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Event Registration</h1>
        <p>Register for your favourite college event</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="registration.html">Registration</a>
        <a href="contact.html">Contact Us</a>
        <a href="view-registrations.html">View Registrations</a>
    </nav>

    <main>
        <h2>Student Registration</h2>

        <form>

            <label for="name">Student Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="regno">Registration Number:</label>
            <input type="text" id="regno" name="regno" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="event">Select Event:</label>
            <select id="event" name="event" required>
                <option value="">-- Select an Event --</option>
                <option value="Technical Symposium">Technical Symposium</option>
                <option value="Cultural Fest">Cultural Fest</option>
                <option value="Sports Meet">Sports Meet</option>
            </select>

            <button type="submit">Submit Registration</button>

        </form>
    </main>

    <footer>
        <p>College Event Management System</p>
    </footer>
    <script src="js/script.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
